[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracer"
version = "0.1.0"
requires-python = ">=3.10.9"
authors = [{ name = "Ricardo-shuo-liu", email = "13838152117@139.com" }]
description = ""
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["tracer", "debug", "cs61a", "stack-trace"]
dependencies = []

[project.urls]
# Homepage = ""
# "Bug Tracker" = ""

[tool.setuptools.packages.find]
where = ["."]
include = ["tracer*"]
exclude = ["tests*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=0.10.0"
]